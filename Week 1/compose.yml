services:
  php:
    container_name: php-myapp
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres-myapp
    image: postgres:18.6
    environment:
      - POSTGRES_HOST
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready --quiet -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./database-data:/var/lib/postgresql/data

volumes:
  database-data:

networks:
  default:
    name: myapp-network
    external: true